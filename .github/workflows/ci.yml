name: Build

on:
  push:
    branches:
      - main
    tags: ['*']
    paths-ignore:
      - 'README.md'
  pull_request:
  workflow_dispatch:

jobs:
  build_latex:
    name: RE4B
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile LaTeX document
        uses: dante-ev/latex-action@latest
        with:
          root_file: RE4B-EN.tex
          compiler: ./.github/scripts/compile-latex.sh
          args: -xelatex
          extra_system_packages: fonts-dejavu-core
      - name: Upload PDF file
        uses: actions/upload-artifact@v6
        with:
          name: RE4B-EN
          path: |
            RE4B-EN.pdf
            RE4B-EN.log
